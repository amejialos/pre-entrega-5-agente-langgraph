[project]
name = "agente-ciclico"
version = "0.1.0"
description = "Pre-entrega 5: agente ReAct con LangGraph, herramientas propias y memoria persistente en SQLite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "python-dotenv>=1.2.4",
]

# No es un paquete instalable: los módulos viven en la raíz y se importan desde ahí.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
